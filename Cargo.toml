[package]
name = "gif-compressor"
description = "GIF compression by undoing dithering"
repository = "https://github.com/waresnew/gif-compressor"
version = "0.1.0"
edition = "2024"

[dependencies]
bitcode = "0.6.9"
bytemuck = "1.25.2"
clap = { version = "4.6.4", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
env_logger = "0.11.11"
gif = "0.14.1"
indexmap = "2.14.0"
log = "0.4.33"
pollster = "1.0.1"
tempfile = "3.27.0"
wgpu = "30.0.0"

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.2"
