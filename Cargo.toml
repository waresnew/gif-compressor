[package]
name = "gif-compressor"
description = "GIF compression by undoing dithering"
repository = "https://github.com/waresnew/gif-compressor"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
clap = { version = "4.6.4", features = ["derive"] }
gif = "0.14.1"
rayon = "1.11.0"

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.2"

[[bench]]
name = "nearest_neighbour"
harness = false
